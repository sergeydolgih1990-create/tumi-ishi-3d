<style>
  :root {
    --ground: #e9edee;
    --panel: #f7f9f9;
    --ink: #13191c;
    --muted: #5d6a6f;
    --line: #c6d0d2;
    --accent: #1f6f8b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101618;
      --panel: #182023;
      --ink: #e8eded;
      --muted: #94a3a8;
      --line: #2b383c;
      --accent: #5bb2cf;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101618;
    --panel: #182023;
    --ink: #e8eded;
    --muted: #94a3a8;
    --line: #2b383c;
    --accent: #5bb2cf;
    color-scheme: dark;
  }
  html { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 16px 24px;
    max-width: 1180px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  header h1 { font-size: 21px; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row .label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .row button {
    font: inherit;
    font-size: 14px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  .row button[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 -2px 0 var(--accent);
    font-weight: 500;
  }
  .row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    min-height: 380px;
    height: 60vh;
    overflow: hidden;
  }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hint {
    position: absolute;
    left: 12px;
    bottom: 10px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    padding: 3px 7px;
    border-radius: 2px;
  }
  .toggles { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  /* клетки разделены своими рамками, а не просветом фона: иначе неполный ряд
     оставлял пустую серую клетку */
  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin: 0;
  }
  .facts div {
    padding: 10px 14px;
    box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line);
  }
  .facts dt {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 2px;
  }
  .facts dd {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
  }
  .note { color: var(--muted); font-size: 13px; margin: 0; max-width: 72ch; }
  @media (max-width: 640px) { .stage { min-height: 300px; } }
</style>

  <dl class="facts" id="facts"></dl>

  <p class="note" id="desc"></p>
  <p class="note" id="t-note"></p>
</div>

<script>
(function () {
  var ДАННЫЕ = window.НАБОР || { варианты: [] };
  // шапка страницы может приходить с данными (клиентская страница)
  var ШАПКА = ДАННЫЕ["шапка"];
  if (ШАПКА) {
    if (ШАПКА.title) document.title = ШАПКА.title;
    [["t-h1", "h1"], ["t-lead", "lead"], ["t-note", "note"]].forEach(function (p) {
      var el = document.getElementById(p[0]);
      if (el && ШАПКА[p[1]] != null) el.textContent = ШАПКА[p[1]];
    });
  }
  var ВАРИАНТЫ = ДАННЫЕ["варианты"];

  var canvas = document.getElementById("c");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(34, 1, 1, 5000);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa7ab, 0.7));
  var key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(-260, -420, 520);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.45);
  fill.position.set(380, -120, 220);
  scene.add(fill);
  var rim = new THREE.DirectionalLight(0xffffff, 0.35);
  rim.position.set(0, 400, 300);
  scene.add(rim);

  // стол: сетка 10 мм в плоскости Z = 0
  var grid = new THREE.GridHelper(600, 60, 0x8a979c, 0x8a979c);
  grid.rotation.x = Math.PI / 2;
  grid.material.transparent = true;
  grid.material.opacity = 0.28;
  scene.add(grid);

  // дуб под прозрачным маслом и под белым: цвет меняется галочкой
  var woodMat = new THREE.MeshStandardMaterial({ color: 0xc49a66, roughness: 0.75, metalness: 0.0 });
  document.getElementById("white").addEventListener("change", function (e) {
    woodMat.color.setHex(e.target.checked ? 0xe4ddd0 : 0xc49a66);
  });

  function buffer(b64) {
    var bin = atob(b64);
    var buf = new ArrayBuffer(bin.length);
    var view = new Uint8Array(buf);
    for (var i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
    return buf;
  }

  // геометрия индексированная; у подставки вершины на острых рёбрах разведены при выгрузке,
  // поэтому плоские грани остаются плоскими, а скругления — гладкими.
  // Координаты лежат целыми шагами (int16), индексы — uint16 или uint32: так страница легче.
  var ШАГ = ДАННЫЕ["шаг"] || 0.01;
  // сетки сжаты deflate: распаковываем все один раз при открытии, дальше работаем с буферами
  function распаковать1(b64, packed) {
    var buf = buffer(b64);
    if (!packed) return Promise.resolve(buf);
    var stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Response(stream).arrayBuffer();
  }
  function распаковать(d) {
    if (!d) return Promise.resolve();
    return Promise.all([распаковать1(d["позиции"], d["сжато"]),
                        распаковать1(d["индексы"], d["сжато"])]).then(function (r) {
      d._pos = r[0]; d._idx = r[1];
    });
  }
  function geometryFrom(d) {
    var q = new Int16Array(d._pos);
    var pos = new Float32Array(q.length);
    for (var i = 0; i < q.length; i++) pos[i] = q[i] * ШАГ;
    var idx = d["биты_индексов"] === 32 ? new Uint32Array(d._idx) : new Uint16Array(d._idx);
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals();
    return geo;
  }

  var standMesh = null, центр = [0, 10, 10];
  function показать(i) {
    var d = ВАРИАНТЫ[i];
    if (!d._pos) return;                      // ещё распаковывается
    if (standMesh) { scene.remove(standMesh); standMesh.geometry.dispose(); }
    standMesh = new THREE.Mesh(geometryFrom(d), woodMat);
    scene.add(standMesh);
    центр = d["центр"] || центр;
    document.getElementById("facts").innerHTML =
      (d["факты"] || []).map(function (f) { return факт(f[0], f[1]); }).join("");
    document.getElementById("desc").textContent = d["описание"] || "";
    Array.prototype.forEach.call(document.querySelectorAll("#variants button"), function (b, k) {
      b.setAttribute("aria-pressed", k === i ? "true" : "false");
    });
  }

  function число(v) { return String(Math.round(v * 10) / 10).replace(".", ","); }
  function факт(k, v) { return "<div><dt>" + k + "</dt><dd>" + v + "</dd></div>"; }

  ВАРИАНТЫ.forEach(function (d, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = d["подпись"] || d["имя"];
    b.addEventListener("click", function () { показать(i); });
    document.getElementById("variants").appendChild(b);
  });

  // орбита вокруг середины композиции
  var азимут = -2.0, высота = 0.32, дистанция = 640;
  var РАКУРСЫ = {
    "34": [-2.0, 0.32, 640],
    "front": [-Math.PI / 2, 0.08, 640],
    "side": [0, 0.08, 640],
    "top": [-Math.PI / 2, 1.5, 720],
    "close": [-2.2, 0.28, 330]
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (b) {
    b.addEventListener("click", function () {
      var r = РАКУРСЫ[b.getAttribute("data-view")];
      азимут = r[0]; высота = r[1]; дистанция = r[2];
      document.getElementById("spin").checked = false;
    });
  });

  var drag = null;
  function point(e) { var t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; }
  canvas.addEventListener("pointerdown", function (e) { drag = point(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var p = point(e);
    азимут -= (p.x - drag.x) * 0.008;
    высота = Math.max(-1.2, Math.min(1.5, высота + (p.y - drag.y) * 0.006));
    drag = p;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    canvas.addEventListener(ev, function () { drag = null; });
  });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    дистанция = Math.max(70, Math.min(1100, дистанция * (1 + Math.sign(e.deltaY) * 0.1)));
  }, { passive: false });

  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  }

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var цель = new THREE.Vector3();
  function tick() {
    resize();
    if (document.getElementById("spin").checked && !reduced) азимут += 0.003;
    цель.set(центр[0], центр[1], центр[2]);
    camera.position.set(
      цель.x + дистанция * Math.cos(высота) * Math.cos(азимут),
      цель.y + дистанция * Math.cos(высота) * Math.sin(азимут),
      цель.z + дистанция * Math.sin(высота)
    );
    camera.up.set(0, 0, 1);
    camera.lookAt(цель);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  if (ВАРИАНТЫ.length) {
    Promise.all(ВАРИАНТЫ.map(распаковать))
      .then(function () {
        показать(ДАННЫЕ["начать_с"] != null ? ДАННЫЕ["начать_с"] : ВАРИАНТЫ.length - 1);
        tick();
      })
      .catch(function (e) {
        document.getElementById("desc").textContent = "Модели не распаковались: " + e;
      });
  }
  else { document.getElementById("desc").textContent = "Модели не загрузились."; }
})();
</script>
